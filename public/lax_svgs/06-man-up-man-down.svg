<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes passOrbit { 0% { cx: 310; cy: 115; } 16% { cx: 250; cy: 68; } 33% { cx: 185; cy: 48; } 50% { cx: 165; cy: 115; } 66% { cx: 185; cy: 182; } 83% { cx: 250; cy: 162; } 100% { cx: 310; cy: 115; } }
      @keyframes penaltyPulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.6; } }
      @keyframes timerDrain { from { width: 50; } to { width: 0; } }
    </style>
  </defs>

  <rect width="900" height="580" fill="#fffff8"/>

  <text x="52" y="36" font-size="19" fill="#333" font-weight="400" style="animation: fadeIn 0.8s ease" letter-spacing="0.3">Man-Up and Man-Down</text>
  <text x="52" y="56" font-size="12" fill="#999" font-style="italic">The power play: what happens when a player is sent to the penalty box</text>
  <line x1="52" y1="64" x2="848" y2="64" stroke="#ccc" stroke-width="0.5"/>

  <!-- ===== CONCEPT ===== -->
  <g transform="translate(52, 88)" style="animation: fadeIn 0.5s ease 0.2s both">
    <text x="0" y="0" font-size="11" fill="#444">When a player commits a personal foul, he serves time in the penalty box. His team plays</text>
    <text x="0" y="18" font-size="11" fill="#444">one man short. The team with the numerical advantage is on the <tspan font-style="italic">extra-man offense</tspan> (EMO),</text>
    <text x="0" y="36" font-size="11" fill="#444">commonly called <tspan font-style="italic">man-up</tspan>. The short-handed team is <tspan font-style="italic">man-down</tspan>.</text>
  </g>

  <!-- ===== 6v5 DIAGRAM ===== -->
  <g transform="translate(52, 150)" style="animation: fadeIn 0.6s ease 0.5s both">
    <text x="0" y="0" font-size="12" fill="#555" font-variant="small-caps" letter-spacing="1">the 6-on-5 situation</text>

    <g transform="translate(0, 18)">
      <!-- Half field -->
      <rect x="0" y="0" width="360" height="210" fill="#e8efe8" stroke="#bbb" stroke-width="0.5"/>

      <!-- Goal (set in from end line with space behind) -->
      <rect x="120" y="90" width="4" height="24" fill="#c0392b" opacity="0.6"/>
      <!-- Crease -->
      <circle cx="124" cy="102" r="30" fill="none" stroke="#999" stroke-width="0.5"/>

      <!-- Goalie (defense) -->
      <polygon points="134,96 139,102 134,108 129,102" fill="#888" opacity="0.6"/>

      <!-- Man-up offense: 6 players (2-3-1) -->
      <circle cx="155" cy="36" r="4.5" fill="#333" opacity="0.8"/>
      <text x="166" y="40" font-size="7.5" fill="#555">A</text>
      <circle cx="220" cy="58" r="4.5" fill="#333" opacity="0.8"/>
      <text x="231" y="62" font-size="7.5" fill="#555">M</text>
      <circle cx="47" cy="102" r="4.5" fill="#333" opacity="0.8"/>
      <text x="37" y="93" font-size="7.5" fill="#555">A</text>
      <circle cx="220" cy="150" r="4.5" fill="#333" opacity="0.8"/>
      <text x="231" y="154" font-size="7.5" fill="#555">M</text>
      <circle cx="155" cy="174" r="4.5" fill="#333" opacity="0.8"/>
      <text x="166" y="178" font-size="7.5" fill="#555">A</text>
      <!-- Point M — OPEN (the man-up advantage!) -->
      <circle cx="270" cy="102" r="4.5" fill="#333" opacity="0.8"/>
      <text x="281" y="106" font-size="7.5" fill="#555">M</text>
      <text x="270" y="88" text-anchor="middle" font-size="7" fill="#c0392b" font-style="italic">open!</text>

      <!-- Man-down defense: 5 players in diamond zone right of crease -->
      <!-- Top of diamond -->
      <rect x="172" y="56" width="7" height="7" fill="#666" opacity="0.7"/>
      <text x="163" y="63" font-size="7.5" fill="#999">D</text>
      <!-- Right of diamond -->
      <rect x="196" y="99" width="7" height="7" fill="#666" opacity="0.7"/>
      <text x="207" y="106" font-size="7.5" fill="#999">M</text>
      <!-- Center of diamond -->
      <rect x="168" y="99" width="7" height="7" fill="#666" opacity="0.7"/>
      <text x="159" y="106" font-size="7.5" fill="#999">D</text>
      <!-- Bottom of diamond -->
      <rect x="172" y="142" width="7" height="7" fill="#666" opacity="0.7"/>
      <text x="163" y="149" font-size="7.5" fill="#999">D</text>
      <!-- Left of diamond (near crease) -->
      <rect x="152" y="99" width="7" height="7" fill="#666" opacity="0.7"/>
      <text x="143" y="106" font-size="7.5" fill="#999">M</text>

      <!-- Ball orbiting the formation -->
      <circle r="3" fill="#c0392b" opacity="0.65">
        <animate attributeName="cx" values="270;220;155;47;155;220;270" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="102;58;36;102;174;150;102" dur="5s" repeatCount="indefinite"/>
      </circle>

      <!-- Annotations -->
      <text x="230" y="12" font-size="9" fill="#555" font-style="italic">6 attackers (&#9679;)</text>
      <text x="85" y="12" font-size="9" fill="#999" font-style="italic">5 defenders (&#9632;)</text>
    </g>

    <!-- Penalty box — small, off to the side -->
    <g transform="translate(390, 18)">
      <rect x="0" y="0" width="120" height="60" fill="none" stroke="#bbb" stroke-width="0.5"/>
      <text x="60" y="14" text-anchor="middle" font-size="9" fill="#999" font-variant="small-caps" letter-spacing="0.5">penalty box</text>

      <!-- Penalized player -->
      <rect x="55" y="28" width="9" height="9" fill="#666" opacity="0.4">
        <animate attributeName="opacity" values="0.25;0.5;0.25" dur="2s" repeatCount="indefinite"/>
      </rect>

      <!-- Timer bar -->
      <rect x="30" y="46" width="50" height="4" fill="#ddd"/>
      <rect x="30" y="46" height="4" fill="#c0392b" opacity="0.5">
        <animate attributeName="width" values="50;0;50" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- ===== STRATEGY ===== -->
  <g transform="translate(52, 405)" style="animation: fadeIn 0.8s ease 0.8s both">
    <text x="0" y="0" font-size="12" fill="#555" font-variant="small-caps" letter-spacing="1">strategy</text>

    <!-- Two columns — Tufte: clean prose, no boxes -->
    <g transform="translate(0, 22)">
      <text x="0" y="0" font-size="11" fill="#444" font-style="italic">Man-up offense</text>
      <text x="0" y="18" font-size="11" fill="#444">Quick ball movement around the perimeter to</text>
      <text x="0" y="34" font-size="11" fill="#444">create open shots. Common formations include</text>
      <text x="0" y="50" font-size="11" fill="#444">the 1-3-2, 2-3-1, and 1-4-1. The goal is to</text>
      <text x="0" y="66" font-size="11" fill="#444">exploit the gap before penalty time expires.</text>
    </g>

    <g transform="translate(430, 22)">
      <text x="0" y="0" font-size="11" fill="#444" font-style="italic">Man-down defense</text>
      <text x="0" y="18" font-size="11" fill="#444">Compact zone around the crease, often a box</text>
      <text x="0" y="34" font-size="11" fill="#444">or diamond shape. Defenders use aggressive</text>
      <text x="0" y="50" font-size="11" fill="#444">stick checks to disrupt passing lanes and try</text>
      <text x="0" y="66" font-size="11" fill="#444">to burn the clock until their teammate returns.</text>
    </g>
  </g>

  <!-- ===== EDGE CASES ===== -->
  <line x1="52" y1="510" x2="848" y2="510" stroke="#ddd" stroke-width="0.5"/>
  <g transform="translate(52, 530)" style="animation: fadeIn 0.8s ease 1.2s both">
    <text x="0" y="0" font-size="10" fill="#999" font-style="italic">Multiple penalties can stack: a team may play 5-on-4, or in rare cases 5-on-3.</text>
    <text x="0" y="16" font-size="10" fill="#999" font-style="italic">For a releasable penalty, the player returns when the opposing team scores; for non-releasable, the full time must be served.</text>
  </g>
</svg>