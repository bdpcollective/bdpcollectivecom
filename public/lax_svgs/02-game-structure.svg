<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes clockSweep { from { stroke-dashoffset: 94; } to { stroke-dashoffset: 0; } }
      @keyframes faceoffClamp { 0%, 100% { transform: translateX(0); } 40% { transform: translateX(-6px); } 60% { transform: translateX(6px); } }
      @keyframes ballLift { 0%, 100% { cy: 5; } 40% { cy: -8; } }
    </style>
  </defs>

  <rect width="900" height="560" fill="#fffff8"/>

  <!-- Title -->
  <text x="52" y="36" font-size="19" fill="#333" font-weight="400" style="animation: fadeIn 0.8s ease" letter-spacing="0.3">Game Structure</text>
  <text x="52" y="56" font-size="12" fill="#999" font-style="italic">Four quarters, a running clock, and the faceoff</text>
  <line x1="52" y1="64" x2="848" y2="64" stroke="#ccc" stroke-width="0.5"/>

  <!-- ===== TIMELINE — Tufte sparkline-inspired quarter bar ===== -->
  <g transform="translate(52, 90)" style="animation: fadeIn 0.6s ease 0.2s both">
    <text x="0" y="0" font-size="12" fill="#555" font-variant="small-caps" letter-spacing="1">quarters</text>

    <!-- Thin baseline -->
    <line x1="0" y1="30" x2="740" y2="30" stroke="#ddd" stroke-width="0.5"/>

    <!-- Q1 -->
    <rect x="0" y="18" width="160" height="24" fill="#333" opacity="0.75" style="animation: slideIn 0.5s ease 0.3s both"/>
    <text x="80" y="34" text-anchor="middle" fill="#fffff8" font-size="10.5">Q1 &#8212; 15 min</text>

    <!-- Q2 -->
    <rect x="170" y="18" width="160" height="24" fill="#333" opacity="0.6" style="animation: slideIn 0.5s ease 0.5s both"/>
    <text x="250" y="34" text-anchor="middle" fill="#fffff8" font-size="10.5">Q2 &#8212; 15 min</text>

    <!-- Halftime gap -->
    <text x="365" y="34" text-anchor="middle" font-size="9" fill="#999" font-style="italic" style="animation: fadeIn 0.5s ease 0.7s both">halftime</text>
    <line x1="340" y1="30" x2="390" y2="30" stroke="#ccc" stroke-width="0.5" stroke-dasharray="3 2"/>

    <!-- Q3 -->
    <rect x="400" y="18" width="160" height="24" fill="#333" opacity="0.6" style="animation: slideIn 0.5s ease 0.9s both"/>
    <text x="480" y="34" text-anchor="middle" fill="#fffff8" font-size="10.5">Q3 &#8212; 15 min</text>

    <!-- Q4 -->
    <rect x="570" y="18" width="160" height="24" fill="#333" opacity="0.75" style="animation: slideIn 0.5s ease 1.1s both"/>
    <text x="650" y="34" text-anchor="middle" fill="#fffff8" font-size="10.5">Q4 &#8212; 15 min</text>

    <!-- Total annotation — right-aligned marginal note -->
    <text x="740" y="14" text-anchor="end" font-size="10" fill="#999" font-style="italic">60 minutes of regulation play</text>
  </g>

  <!-- ===== CLOCK RULES ===== -->
  <g transform="translate(52, 170)" style="animation: fadeIn 0.8s ease 0.6s both">
    <text x="0" y="0" font-size="12" fill="#555" font-variant="small-caps" letter-spacing="1">the clock</text>

    <!-- Minimal clock icon -->
    <circle cx="22" cy="40" r="15" fill="none" stroke="#888" stroke-width="0.75"/>
    <circle cx="22" cy="40" r="12.5" fill="none" stroke="#c0392b" stroke-width="1" stroke-dasharray="94" stroke-linecap="round" transform="rotate(-90 22 40)" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="94" to="0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <line x1="22" y1="40" x2="22" y2="30" stroke="#555" stroke-width="0.75"/>
    <line x1="22" y1="40" x2="30" y2="40" stroke="#c0392b" stroke-width="0.5" opacity="0.6"/>

    <text x="52" y="30" font-size="11" fill="#444">The clock runs continuously for most of the game.</text>
    <text x="52" y="48" font-size="11" fill="#444">In the <tspan font-style="italic">final two minutes</tspan> of Q4, if the score is within two goals,</text>
    <text x="52" y="64" font-size="11" fill="#444">the clock stops on every whistle, goal, and penalty.</text>
  </g>

  <!-- ===== FACEOFF ===== -->
  <g transform="translate(52, 270)" style="animation: fadeIn 0.8s ease 1s both">
    <text x="0" y="0" font-size="12" fill="#555" font-variant="small-caps" letter-spacing="1">the faceoff</text>

    <!-- Small faceoff diagram — Tufte small-multiple aesthetic -->
    <g transform="translate(10, 20)">
      <!-- Minimal field patch -->
      <rect x="0" y="0" width="90" height="50" fill="#e8efe8" stroke="#bbb" stroke-width="0.5"/>
      <line x1="45" y1="0" x2="45" y2="50" stroke="#999" stroke-width="0.5"/>

      <!-- Center X -->
      <line x1="42" y1="22" x2="48" y2="28" stroke="#888" stroke-width="0.5"/>
      <line x1="48" y1="22" x2="42" y2="28" stroke="#888" stroke-width="0.5"/>

      <!-- Two players -->
      <circle cx="32" cy="25" r="4" fill="#333" opacity="0.8">
        <animate attributeName="cx" values="32;26;32" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="58" cy="25" r="4" fill="none" stroke="#333" stroke-width="1">
        <animate attributeName="cx" values="58;64;58" dur="2.5s" repeatCount="indefinite"/>
      </circle>

      <!-- Ball -->
      <circle cx="45" r="2.5" fill="#c0392b" opacity="0.7">
        <animate attributeName="cy" values="25;14;25" dur="2.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="118" y="30" font-size="11" fill="#444">A faceoff begins each quarter and follows every goal. Two players crouch</text>
    <text x="118" y="46" font-size="11" fill="#444">at the center X, sticks flat beside the ball. On the whistle, they clamp</text>
    <text x="118" y="62" font-size="11" fill="#444">and fight for possession. Wing players release; all others wait behind</text>
    <text x="118" y="78" font-size="11" fill="#444">the restraining lines until one team gains control.</text>
  </g>

  <!-- ===== OVERTIME ===== -->
  <g transform="translate(52, 388)" style="animation: fadeIn 0.8s ease 1.3s both">
    <text x="0" y="0" font-size="12" fill="#555" font-variant="small-caps" letter-spacing="1">overtime</text>
    <text x="0" y="22" font-size="11" fill="#444">If tied after regulation: sudden-death periods, typically four minutes each.</text>
    <text x="0" y="38" font-size="11" fill="#444">The first team to score wins. Each period begins with a faceoff at center.</text>
  </g>

  <!-- ===== TIMEOUTS ===== -->
  <g transform="translate(52, 448)" style="animation: fadeIn 0.8s ease 1.6s both">
    <text x="0" y="0" font-size="12" fill="#555" font-variant="small-caps" letter-spacing="1">timeouts</text>
    <text x="0" y="22" font-size="11" fill="#444">Each team receives two timeouts per half, each lasting two minutes.</text>
    <text x="0" y="38" font-size="11" fill="#444">Only the team with possession &#8212; or either team after a goal &#8212; may call one.</text>
  </g>

  <!-- Bottom rule -->
  <line x1="52" y1="510" x2="848" y2="510" stroke="#ddd" stroke-width="0.5"/>
  <text x="52" y="530" font-size="9.5" fill="#bbb" font-style="italic">Televised games include additional media timeouts at prescribed intervals.</text>
</svg>