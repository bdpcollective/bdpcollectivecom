<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1120" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes warnAppear { 0%, 40% { opacity: 0; } 45%, 75% { opacity: 0.7; } 80%, 100% { opacity: 0; } }
      @keyframes dashDrift { to { stroke-dashoffset: -12; } }
    </style>
  </defs>

  <rect width="900" height="1120" fill="#fffff8"/>

  <text x="52" y="36" font-size="22" fill="#333" font-weight="400" style="animation: fadeIn 0.8s ease" letter-spacing="0.3">The Offsides Rule</text>
  <text x="52" y="56" font-size="14" fill="#999" font-style="italic">Maintaining the count: three on offense, four on defense</text>
  <line x1="52" y1="64" x2="848" y2="64" stroke="#ccc" stroke-width="0.5"/>

  <!-- ===== THE RULE ===== -->
  <g transform="translate(52, 88)" style="animation: fadeIn 0.5s ease 0.2s both">
    <text x="0" y="0" font-size="13" fill="#444">A team must keep at least <tspan font-weight="600">three players</tspan> in its offensive half and at least <tspan font-weight="600">four players</tspan></text>
    <text x="0" y="18" font-size="13" fill="#444">(including the goalie) in its defensive half at all times. With ten on the field, this means a</text>
    <text x="0" y="36" font-size="13" fill="#444">permanent 3/4+G split. Midfielders, who cross freely, are responsible for maintaining the count.</text>
  </g>

  <!-- ===== LEGAL FIELD ===== -->
  <g style="animation: fadeIn 0.6s ease 0.5s both">
    <text x="450" y="152" text-anchor="middle" font-size="14" fill="#555" font-style="italic">legal &#8212; correct count</text>

    <!-- Field: 796x340, matching field-and-positions -->
    <rect x="52" y="166" width="796" height="340" fill="#e8efe8" stroke="#999" stroke-width="0.5"/>

    <!-- Midfield line -->
    <line x1="450" y1="166" x2="450" y2="506" stroke="#888" stroke-width="0.75"/>

    <!-- Restraining lines -->
    <line x1="228" y1="166" x2="228" y2="506" stroke="#888" stroke-width="0.5" stroke-dasharray="6 3" style="animation: dashDrift 2s linear infinite"/>
    <line x1="672" y1="166" x2="672" y2="506" stroke="#888" stroke-width="0.5" stroke-dasharray="6 3" style="animation: dashDrift 2s linear infinite"/>

    <!-- Goals (height=30, centered at field center y=336) -->
    <rect x="157" y="321" width="5" height="30" fill="#c0392b" opacity="0.8"/>
    <rect x="738" y="321" width="5" height="30" fill="#c0392b" opacity="0.8"/>

    <!-- Creases (r=34, matching field-and-positions) -->
    <circle cx="160" cy="336" r="34" fill="none" stroke="#888" stroke-width="0.5"/>
    <circle cx="740" cy="336" r="34" fill="none" stroke="#888" stroke-width="0.5"/>

    <!-- Faceoff circle -->
    <circle cx="450" cy="336" r="20" fill="none" stroke="#888" stroke-width="0.5"/>

    <!-- Attackmen — around offensive crease -->
    <circle cx="195" cy="254" r="6" fill="#333" opacity="0.85"/>
    <text x="207" y="258" font-size="11" fill="#555">A</text>
    <circle cx="85" cy="336" r="6" fill="#333" opacity="0.85"/>
    <text x="97" y="340" font-size="11" fill="#555">A</text>
    <circle cx="195" cy="419" r="6" fill="#333" opacity="0.85"/>
    <text x="207" y="423" font-size="11" fill="#555">A</text>

    <!-- Midfielders — around midfield -->
    <circle cx="375" cy="234" r="6" fill="none" stroke="#333" stroke-width="1.2"/>
    <text x="387" y="238" font-size="11" fill="#555">M</text>
    <circle cx="355" cy="329" r="6" fill="none" stroke="#333" stroke-width="1.2"/>
    <text x="367" y="333" font-size="11" fill="#555">M</text>
    <circle cx="375" cy="439" r="6" fill="none" stroke="#333" stroke-width="1.2"/>
    <text x="387" y="443" font-size="11" fill="#555">M</text>

    <!-- Defensemen — vertical line left of defensive crease -->
    <rect x="675" y="249" width="10" height="10" fill="#666" opacity="0.85"/>
    <text x="693" y="259" font-size="11" fill="#555">D</text>
    <rect x="645" y="331" width="10" height="10" fill="#666" opacity="0.85"/>
    <text x="663" y="341" font-size="11" fill="#555">D</text>
    <rect x="675" y="413" width="10" height="10" fill="#666" opacity="0.85"/>
    <text x="693" y="423" font-size="11" fill="#555">D</text>

    <!-- Goalie — left of goal -->
    <polygon points="728,328 736,336 728,344 720,336" fill="#999" opacity="0.85"/>
    <text x="728" y="360" text-anchor="middle" font-size="11" fill="#555">G</text>

    <!-- Count annotations -->
    <text x="160" y="524" text-anchor="middle" font-size="12" fill="#555" font-weight="600">3 in offensive half</text>
    <text x="450" y="524" text-anchor="middle" font-size="12" fill="#555" font-weight="600">3 midfielders</text>
    <text x="740" y="524" text-anchor="middle" font-size="12" fill="#555" font-weight="600">4 in defensive half</text>

    <!-- Half labels -->
    <text x="240" y="184" font-size="11" fill="#777" letter-spacing="1.5" font-variant="small-caps">offensive half</text>
    <text x="580" y="184" font-size="11" fill="#777" letter-spacing="1.5" font-variant="small-caps">defensive half</text>
  </g>

  <!-- ===== OFFSIDES FIELD ===== -->
  <g style="animation: fadeIn 0.6s ease 0.7s both">
    <text x="450" y="560" text-anchor="middle" font-size="14" fill="#c0392b" font-style="italic">offsides &#8212; a defenseman crossed midfield illegally</text>

    <!-- Field: 796x340, matching field-and-positions -->
    <rect x="52" y="574" width="796" height="340" fill="#e8efe8" stroke="#bbb" stroke-width="0.5"/>

    <!-- Midfield line -->
    <line x1="450" y1="574" x2="450" y2="914" stroke="#888" stroke-width="0.75"/>

    <!-- Restraining lines -->
    <line x1="228" y1="574" x2="228" y2="914" stroke="#888" stroke-width="0.5" stroke-dasharray="6 3" style="animation: dashDrift 2s linear infinite"/>
    <line x1="672" y1="574" x2="672" y2="914" stroke="#888" stroke-width="0.5" stroke-dasharray="6 3" style="animation: dashDrift 2s linear infinite"/>

    <!-- Goals -->
    <rect x="157" y="729" width="5" height="30" fill="#c0392b" opacity="0.8"/>
    <rect x="738" y="729" width="5" height="30" fill="#c0392b" opacity="0.8"/>

    <!-- Creases -->
    <circle cx="160" cy="744" r="34" fill="none" stroke="#888" stroke-width="0.5"/>
    <circle cx="740" cy="744" r="34" fill="none" stroke="#888" stroke-width="0.5"/>

    <!-- Faceoff circle -->
    <circle cx="450" cy="744" r="20" fill="none" stroke="#888" stroke-width="0.5"/>

    <!-- Attackmen — around offensive crease -->
    <circle cx="195" cy="662" r="6" fill="#333" opacity="0.85"/>
    <text x="207" y="666" font-size="11" fill="#555">A</text>
    <circle cx="85" cy="744" r="6" fill="#333" opacity="0.85"/>
    <text x="97" y="748" font-size="11" fill="#555">A</text>
    <circle cx="195" cy="827" r="6" fill="#333" opacity="0.85"/>
    <text x="207" y="831" font-size="11" fill="#555">A</text>

    <!-- Midfielders — in offensive half -->
    <circle cx="340" cy="662" r="6" fill="none" stroke="#333" stroke-width="1.2"/>
    <text x="352" y="666" font-size="11" fill="#555">M</text>
    <circle cx="360" cy="744" r="6" fill="none" stroke="#333" stroke-width="1.2"/>
    <text x="372" y="748" font-size="11" fill="#555">M</text>
    <circle cx="340" cy="827" r="6" fill="none" stroke="#333" stroke-width="1.2"/>
    <text x="352" y="831" font-size="11" fill="#555">M</text>

    <!-- Defenseman who crossed illegally — animated -->
    <g>
      <rect width="10" height="10" fill="#c0392b" opacity="0.85">
        <animate attributeName="x" values="460;340;340;460" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="697;697;697;697" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text font-size="11" fill="#c0392b">
        <animate attributeName="x" values="476;356;356;476" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="707;707;707;707" dur="4s" repeatCount="indefinite"/>
        D &#x2717;
      </text>
    </g>

    <!-- Remaining Defensemen — only 2 left on defensive side -->
    <rect x="675" y="739" width="10" height="10" fill="#666" opacity="0.85"/>
    <text x="693" y="749" font-size="11" fill="#555">D</text>
    <rect x="675" y="821" width="10" height="10" fill="#666" opacity="0.85"/>
    <text x="693" y="831" font-size="11" fill="#555">D</text>

    <!-- Goalie — left of goal -->
    <polygon points="728,736 736,744 728,752 720,744" fill="#999" opacity="0.85"/>
    <text x="728" y="768" text-anchor="middle" font-size="11" fill="#555">G</text>

    <!-- Warning X at midfield when D crosses -->
    <g opacity="0">
      <line x1="442" y1="700" x2="458" y2="716" stroke="#c0392b" stroke-width="1.5"/>
      <line x1="458" y1="700" x2="442" y2="716" stroke="#c0392b" stroke-width="1.5"/>
      <animate attributeName="opacity" values="0;0;0.8;0.8;0" dur="4s" repeatCount="indefinite"/>
    </g>

    <!-- Count annotations -->
    <text x="160" y="932" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="600">7 in offensive half &#8212; too many</text>
    <text x="740" y="932" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="600">3 in defensive half &#8212; too few</text>

    <!-- Half labels -->
    <text x="240" y="592" font-size="11" fill="#777" letter-spacing="1.5" font-variant="small-caps">offensive half</text>
    <text x="580" y="592" font-size="11" fill="#777" letter-spacing="1.5" font-variant="small-caps">defensive half</text>
  </g>

  <!-- ===== CONSEQUENCES ===== -->
  <g transform="translate(52, 964)" style="animation: fadeIn 0.8s ease 1s both">
    <text x="0" y="0" font-size="14" fill="#555" font-variant="small-caps" letter-spacing="1">consequence</text>
    <text x="0" y="22" font-size="13" fill="#444">Offsides is a <tspan font-style="italic">technical foul</tspan>. The offending team loses possession. If they did not have</text>
    <text x="0" y="38" font-size="13" fill="#444">the ball, the penalty is thirty seconds served in the box.</text>
  </g>

  <!-- ===== SUBSTITUTION NOTE ===== -->
  <g transform="translate(52, 1030)" style="animation: fadeIn 0.8s ease 1.2s both">
    <text x="0" y="0" font-size="14" fill="#555" font-variant="small-caps" letter-spacing="1">substitution and the count</text>
    <text x="0" y="22" font-size="13" fill="#444">Substitutions occur on the fly through a box at midfield. If a replacement enters before his</text>
    <text x="0" y="38" font-size="13" fill="#444">teammate exits, the team may be called for <tspan font-style="italic">too many men</tspan> &#8212; another form of offsides.</text>
    <text x="0" y="58" font-size="12" fill="#999" font-style="italic">This is why midfielders must communicate constantly during line changes.</text>
  </g>

  <line x1="52" y1="1102" x2="848" y2="1102" stroke="#ddd" stroke-width="0.5"/>
</svg>
