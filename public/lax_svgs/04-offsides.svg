<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 880" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes warnAppear { 0%, 40% { opacity: 0; } 45%, 75% { opacity: 0.7; } 80%, 100% { opacity: 0; } }
      @keyframes dashDrift { to { stroke-dashoffset: -12; } }
    </style>
  </defs>

  <rect width="900" height="880" fill="#fffff8"/>

  <text x="52" y="36" font-size="22" fill="#333" font-weight="400" style="animation: fadeIn 0.8s ease" letter-spacing="0.3">The Offsides Rule</text>
  <text x="52" y="56" font-size="14" fill="#999" font-style="italic">Maintaining the count: three on offense, four on defense</text>
  <line x1="52" y1="64" x2="848" y2="64" stroke="#ccc" stroke-width="0.5"/>

  <!-- ===== THE RULE ===== -->
  <g transform="translate(52, 88)" style="animation: fadeIn 0.5s ease 0.2s both">
    <text x="0" y="0" font-size="13" fill="#444">A team must keep at least <tspan font-weight="600">three players</tspan> in its offensive half and at least <tspan font-weight="600">four players</tspan></text>
    <text x="0" y="18" font-size="13" fill="#444">(including the goalie) in its defensive half at all times. With ten on the field, this means a</text>
    <text x="0" y="36" font-size="13" fill="#444">permanent 3/4+G split. Midfielders, who cross freely, are responsible for maintaining the count.</text>
  </g>

  <!-- ===== LEGAL FIELD ===== -->
  <g style="animation: fadeIn 0.6s ease 0.5s both">
    <text x="450" y="152" text-anchor="middle" font-size="14" fill="#555" font-style="italic">legal &#8212; correct count</text>

    <!-- Field -->
    <rect x="52" y="166" width="796" height="220" fill="#e8efe8" stroke="#999" stroke-width="0.5"/>

    <!-- Midfield line -->
    <line x1="450" y1="166" x2="450" y2="386" stroke="#888" stroke-width="0.75"/>

    <!-- Restraining lines -->
    <line x1="228" y1="166" x2="228" y2="386" stroke="#888" stroke-width="0.5" stroke-dasharray="6 3" style="animation: dashDrift 2s linear infinite"/>
    <line x1="672" y1="166" x2="672" y2="386" stroke="#888" stroke-width="0.5" stroke-dasharray="6 3" style="animation: dashDrift 2s linear infinite"/>

    <!-- Goals -->
    <rect x="157" y="268" width="5" height="20" fill="#c0392b" opacity="0.8"/>
    <rect x="738" y="268" width="5" height="20" fill="#c0392b" opacity="0.8"/>

    <!-- Creases -->
    <circle cx="160" cy="278" r="24" fill="none" stroke="#888" stroke-width="0.5"/>
    <circle cx="740" cy="278" r="24" fill="none" stroke="#888" stroke-width="0.5"/>

    <!-- Attackmen — around offensive crease -->
    <circle cx="195" cy="220" r="5" fill="#333" opacity="0.85"/>
    <text x="205" y="224" font-size="10" fill="#555">A</text>
    <circle cx="120" cy="278" r="5" fill="#333" opacity="0.85"/>
    <text x="130" y="282" font-size="10" fill="#555">A</text>
    <circle cx="195" cy="340" r="5" fill="#333" opacity="0.85"/>
    <text x="205" y="344" font-size="10" fill="#555">A</text>

    <!-- Midfielders — around midfield -->
    <circle cx="400" cy="210" r="5" fill="none" stroke="#333" stroke-width="1.1"/>
    <text x="410" y="214" font-size="10" fill="#555">M</text>
    <circle cx="380" cy="278" r="5" fill="none" stroke="#333" stroke-width="1.1"/>
    <text x="390" y="282" font-size="10" fill="#555">M</text>
    <circle cx="400" cy="350" r="5" fill="none" stroke="#333" stroke-width="1.1"/>
    <text x="410" y="354" font-size="10" fill="#555">M</text>

    <!-- Defensemen — vertical line left of defensive crease -->
    <rect x="693" y="215" width="9" height="9" fill="#666" opacity="0.85"/>
    <text x="708" y="224" font-size="10" fill="#555">D</text>
    <rect x="693" y="273" width="9" height="9" fill="#666" opacity="0.85"/>
    <text x="708" y="282" font-size="10" fill="#555">D</text>
    <rect x="693" y="333" width="9" height="9" fill="#666" opacity="0.85"/>
    <text x="708" y="342" font-size="10" fill="#555">D</text>

    <!-- Goalie -->
    <polygon points="748,271 754,278 748,285 742,278" fill="#999" opacity="0.85"/>
    <text x="748" y="298" text-anchor="middle" font-size="10" fill="#555">G</text>

    <!-- Count annotations -->
    <text x="160" y="404" text-anchor="middle" font-size="12" fill="#555" font-weight="600">3 in offensive half</text>
    <text x="740" y="404" text-anchor="middle" font-size="12" fill="#555" font-weight="600">4 in defensive half</text>
    <text x="450" y="404" text-anchor="middle" font-size="12" fill="#555" font-weight="600">3 midfielders</text>

    <!-- Half labels -->
    <text x="240" y="184" font-size="11" fill="#777" letter-spacing="1.5" font-variant="small-caps">offensive half</text>
    <text x="580" y="184" font-size="11" fill="#777" letter-spacing="1.5" font-variant="small-caps">defensive half</text>
  </g>

  <!-- ===== OFFSIDES FIELD ===== -->
  <g style="animation: fadeIn 0.6s ease 0.7s both">
    <text x="450" y="440" text-anchor="middle" font-size="14" fill="#c0392b" font-style="italic">offsides &#8212; a defenseman crossed midfield illegally</text>

    <!-- Field -->
    <rect x="52" y="454" width="796" height="220" fill="#e8efe8" stroke="#bbb" stroke-width="0.5"/>

    <!-- Midfield line -->
    <line x1="450" y1="454" x2="450" y2="674" stroke="#888" stroke-width="0.75"/>

    <!-- Restraining lines -->
    <line x1="228" y1="454" x2="228" y2="674" stroke="#888" stroke-width="0.5" stroke-dasharray="6 3" style="animation: dashDrift 2s linear infinite"/>
    <line x1="672" y1="454" x2="672" y2="674" stroke="#888" stroke-width="0.5" stroke-dasharray="6 3" style="animation: dashDrift 2s linear infinite"/>

    <!-- Goals -->
    <rect x="157" y="556" width="5" height="20" fill="#c0392b" opacity="0.8"/>
    <rect x="738" y="556" width="5" height="20" fill="#c0392b" opacity="0.8"/>

    <!-- Creases -->
    <circle cx="160" cy="566" r="24" fill="none" stroke="#888" stroke-width="0.5"/>
    <circle cx="740" cy="566" r="24" fill="none" stroke="#888" stroke-width="0.5"/>

    <!-- Attackmen — around offensive crease -->
    <circle cx="195" cy="508" r="5" fill="#333" opacity="0.85"/>
    <text x="205" y="512" font-size="10" fill="#555">A</text>
    <circle cx="120" cy="566" r="5" fill="#333" opacity="0.85"/>
    <text x="130" y="570" font-size="10" fill="#555">A</text>
    <circle cx="195" cy="628" r="5" fill="#333" opacity="0.85"/>
    <text x="205" y="632" font-size="10" fill="#555">A</text>

    <!-- Midfielders — in offensive half -->
    <circle cx="340" cy="508" r="5" fill="none" stroke="#333" stroke-width="1.1"/>
    <text x="350" y="512" font-size="10" fill="#555">M</text>
    <circle cx="360" cy="566" r="5" fill="none" stroke="#333" stroke-width="1.1"/>
    <text x="370" y="570" font-size="10" fill="#555">M</text>
    <circle cx="340" cy="628" r="5" fill="none" stroke="#333" stroke-width="1.1"/>
    <text x="350" y="632" font-size="10" fill="#555">M</text>

    <!-- Defenseman who crossed illegally — animated -->
    <g>
      <rect width="9" height="9" fill="#c0392b" opacity="0.85">
        <animate attributeName="x" values="460;340;340;460" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="521;521;521;521" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text font-size="10" fill="#c0392b">
        <animate attributeName="x" values="475;355;355;475" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="530;530;530;530" dur="4s" repeatCount="indefinite"/>
        D &#x2717;
      </text>
    </g>

    <!-- Remaining Defensemen — only 2 left on defensive side -->
    <rect x="693" y="561" width="9" height="9" fill="#666" opacity="0.85"/>
    <text x="708" y="570" font-size="10" fill="#555">D</text>
    <rect x="693" y="621" width="9" height="9" fill="#666" opacity="0.85"/>
    <text x="708" y="630" font-size="10" fill="#555">D</text>

    <!-- Goalie -->
    <polygon points="748,559 754,566 748,573 742,566" fill="#999" opacity="0.85"/>
    <text x="748" y="586" text-anchor="middle" font-size="10" fill="#555">G</text>

    <!-- Warning X at midfield when D crosses -->
    <g opacity="0">
      <line x1="442" y1="520" x2="458" y2="536" stroke="#c0392b" stroke-width="1.5"/>
      <line x1="458" y1="520" x2="442" y2="536" stroke="#c0392b" stroke-width="1.5"/>
      <animate attributeName="opacity" values="0;0;0.8;0.8;0" dur="4s" repeatCount="indefinite"/>
    </g>

    <!-- Count annotations -->
    <text x="160" y="692" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="600">7 in offensive half &#8212; too many</text>
    <text x="740" y="692" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="600">3 in defensive half &#8212; too few</text>

    <!-- Half labels -->
    <text x="240" y="472" font-size="11" fill="#777" letter-spacing="1.5" font-variant="small-caps">offensive half</text>
    <text x="580" y="472" font-size="11" fill="#777" letter-spacing="1.5" font-variant="small-caps">defensive half</text>
  </g>

  <!-- ===== CONSEQUENCES ===== -->
  <g transform="translate(52, 724)" style="animation: fadeIn 0.8s ease 1s both">
    <text x="0" y="0" font-size="14" fill="#555" font-variant="small-caps" letter-spacing="1">consequence</text>
    <text x="0" y="22" font-size="13" fill="#444">Offsides is a <tspan font-style="italic">technical foul</tspan>. The offending team loses possession. If they did not have</text>
    <text x="0" y="38" font-size="13" fill="#444">the ball, the penalty is thirty seconds served in the box.</text>
  </g>

  <!-- ===== SUBSTITUTION NOTE ===== -->
  <g transform="translate(52, 790)" style="animation: fadeIn 0.8s ease 1.2s both">
    <text x="0" y="0" font-size="14" fill="#555" font-variant="small-caps" letter-spacing="1">substitution and the count</text>
    <text x="0" y="22" font-size="13" fill="#444">Substitutions occur on the fly through a box at midfield. If a replacement enters before his</text>
    <text x="0" y="38" font-size="13" fill="#444">teammate exits, the team may be called for <tspan font-style="italic">too many men</tspan> &#8212; another form of offsides.</text>
    <text x="0" y="58" font-size="12" fill="#999" font-style="italic">This is why midfielders must communicate constantly during line changes.</text>
  </g>

  <line x1="52" y1="862" x2="848" y2="862" stroke="#ddd" stroke-width="0.5"/>
</svg>
