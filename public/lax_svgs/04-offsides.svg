<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes warnAppear { 0%, 40% { opacity: 0; } 45%, 75% { opacity: 0.7; } 80%, 100% { opacity: 0; } }
      @keyframes dashDrift { to { stroke-dashoffset: -12; } }
    </style>
  </defs>

  <rect width="900" height="540" fill="#fffff8"/>

  <text x="52" y="36" font-size="19" fill="#333" font-weight="400" style="animation: fadeIn 0.8s ease" letter-spacing="0.3">The Offsides Rule</text>
  <text x="52" y="56" font-size="12" fill="#999" font-style="italic">Maintaining the count: three on offense, four on defense</text>
  <line x1="52" y1="64" x2="848" y2="64" stroke="#ccc" stroke-width="0.5"/>

  <!-- ===== THE RULE ===== -->
  <g transform="translate(52, 88)" style="animation: fadeIn 0.5s ease 0.2s both">
    <text x="0" y="0" font-size="11" fill="#444">A team must keep at least <tspan font-weight="600">three players</tspan> in its offensive half and at least <tspan font-weight="600">four players</tspan></text>
    <text x="0" y="18" font-size="11" fill="#444">(including the goalie) in its defensive half at all times. With ten on the field, this means a</text>
    <text x="0" y="36" font-size="11" fill="#444">permanent 3/4+G split. Midfielders, who cross freely, are responsible for maintaining the count.</text>
  </g>

  <!-- ===== SMALL MULTIPLES — legal vs. offsides ===== -->
  <!-- Legal -->
  <g transform="translate(52, 152)" style="animation: fadeIn 0.6s ease 0.5s both">
    <text x="175" y="0" text-anchor="middle" font-size="10" fill="#555" font-style="italic">legal &#8212; correct count</text>

    <g transform="translate(0, 12)">
      <rect x="0" y="0" width="350" height="160" fill="#e8efe8" stroke="#bbb" stroke-width="0.5"/>

      <!-- Midline -->
      <line x1="175" y1="0" x2="175" y2="160" stroke="#888" stroke-width="0.5"/>

      <!-- Restraining lines -->
      <line x1="80" y1="0" x2="80" y2="160" stroke="#999" stroke-width="0.4" stroke-dasharray="4 2"/>
      <line x1="270" y1="0" x2="270" y2="160" stroke="#999" stroke-width="0.4" stroke-dasharray="4 2"/>

      <!-- Offense side — 3 attack -->
      <circle cx="35" cy="40" r="4.5" fill="#333" opacity="0.8"/><text x="45" y="44" font-size="7.5" fill="#777">A</text>
      <circle cx="25" cy="80" r="4.5" fill="#333" opacity="0.8"/><text x="35" y="84" font-size="7.5" fill="#777">A</text>
      <circle cx="35" cy="120" r="4.5" fill="#333" opacity="0.8"/><text x="45" y="124" font-size="7.5" fill="#777">A</text>

      <!-- Midfielders around midfield -->
      <circle cx="145" cy="35" r="4.5" fill="none" stroke="#333" stroke-width="0.9"/><text x="155" y="39" font-size="7.5" fill="#777">M</text>
      <circle cx="155" cy="80" r="4.5" fill="none" stroke="#333" stroke-width="0.9"/><text x="165" y="84" font-size="7.5" fill="#777">M</text>
      <circle cx="145" cy="125" r="4.5" fill="none" stroke="#333" stroke-width="0.9"/><text x="155" y="129" font-size="7.5" fill="#777">M</text>

      <!-- Defense side — 3 defense + goalie -->
      <rect x="296" y="37" width="7" height="7" fill="#666" opacity="0.8"/><text x="309" y="44" font-size="7.5" fill="#777">D</text>
      <rect x="306" y="77" width="7" height="7" fill="#666" opacity="0.8"/><text x="319" y="84" font-size="7.5" fill="#777">D</text>
      <rect x="296" y="117" width="7" height="7" fill="#666" opacity="0.8"/><text x="309" y="124" font-size="7.5" fill="#777">D</text>
      <polygon points="335,74 339,80 335,86 331,80" fill="#888" opacity="0.7"/><text x="344" y="84" font-size="7.5" fill="#777">G</text>

      <!-- Count annotations — below field with clear spacing -->
      <text x="55" y="176" text-anchor="middle" font-size="9" fill="#555" font-weight="600">3</text>
      <text x="305" y="176" text-anchor="middle" font-size="9" fill="#555" font-weight="600">4</text>
    </g>
  </g>

  <!-- Offsides -->
  <g transform="translate(470, 152)" style="animation: fadeIn 0.6s ease 0.7s both">
    <text x="195" y="0" text-anchor="middle" font-size="10" fill="#c0392b" font-style="italic">offsides &#8212; a defenseman crossed illegally</text>

    <g transform="translate(0, 12)">
      <rect x="0" y="0" width="380" height="160" fill="#e8efe8" stroke="#bbb" stroke-width="0.5"/>

      <!-- Midline -->
      <line x1="190" y1="0" x2="190" y2="160" stroke="#888" stroke-width="0.5"/>

      <!-- Restraining lines -->
      <line x1="85" y1="0" x2="85" y2="160" stroke="#999" stroke-width="0.4" stroke-dasharray="4 2"/>
      <line x1="295" y1="0" x2="295" y2="160" stroke="#999" stroke-width="0.4" stroke-dasharray="4 2"/>

      <!-- Offense side — 3 attack + 3 midfielders (6 = legal max) -->
      <circle cx="35" cy="40" r="4.5" fill="#333" opacity="0.8"/><text x="45" y="44" font-size="7.5" fill="#777">A</text>
      <circle cx="25" cy="80" r="4.5" fill="#333" opacity="0.8"/><text x="35" y="84" font-size="7.5" fill="#777">A</text>
      <circle cx="35" cy="120" r="4.5" fill="#333" opacity="0.8"/><text x="45" y="124" font-size="7.5" fill="#777">A</text>

      <circle cx="145" cy="35" r="4.5" fill="none" stroke="#333" stroke-width="0.9"/><text x="155" y="39" font-size="7.5" fill="#777">M</text>
      <circle cx="160" cy="80" r="4.5" fill="none" stroke="#333" stroke-width="0.9"/><text x="170" y="84" font-size="7.5" fill="#777">M</text>
      <circle cx="145" cy="125" r="4.5" fill="none" stroke="#333" stroke-width="0.9"/><text x="155" y="129" font-size="7.5" fill="#777">M</text>

      <!-- Defenseman crossing over — animated (7th player = offsides) -->
      <g>
        <rect x="226" y="46" width="7" height="7" fill="#c0392b" opacity="0.85">
          <animate attributeName="x" values="226;146;146;226" dur="4s" repeatCount="indefinite"/>
        </rect>
        <text y="54" font-size="7.5" fill="#c0392b">
          <animate attributeName="x" values="240;160;160;240" dur="4s" repeatCount="indefinite"/>
          D
        </text>
      </g>

      <!-- Defense — 2D + G remaining (too few when D crosses) -->
      <rect x="316" y="57" width="7" height="7" fill="#666" opacity="0.8"/><text x="329" y="64" font-size="7.5" fill="#777">D</text>
      <rect x="326" y="97" width="7" height="7" fill="#666" opacity="0.8"/><text x="339" y="104" font-size="7.5" fill="#777">D</text>
      <polygon points="360,94 364,100 360,106 356,100" fill="#888" opacity="0.7"/><text x="369" y="104" font-size="7.5" fill="#777">G</text>

      <!-- Count annotations — below field with clear spacing -->
      <text x="75" y="176" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="600">7 &#8212; too many</text>
      <text x="325" y="176" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="600">3 &#8212; too few</text>

      <!-- Warning X -->
      <g opacity="0">
        <line x1="182" y1="60" x2="198" y2="76" stroke="#c0392b" stroke-width="1.2"/>
        <line x1="198" y1="60" x2="182" y2="76" stroke="#c0392b" stroke-width="1.2"/>
        <animate attributeName="opacity" values="0;0;0.7;0.7;0" dur="4s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- ===== CONSEQUENCES ===== -->
  <g transform="translate(52, 378)" style="animation: fadeIn 0.8s ease 1s both">
    <text x="0" y="0" font-size="12" fill="#555" font-variant="small-caps" letter-spacing="1">consequence</text>
    <text x="0" y="22" font-size="11" fill="#444">Offsides is a <tspan font-style="italic">technical foul</tspan>. The offending team loses possession. If they did not have</text>
    <text x="0" y="38" font-size="11" fill="#444">the ball, the penalty is thirty seconds served in the box.</text>
  </g>

  <!-- ===== SUBSTITUTION NOTE ===== -->
  <g transform="translate(52, 438)" style="animation: fadeIn 0.8s ease 1.2s both">
    <text x="0" y="0" font-size="12" fill="#555" font-variant="small-caps" letter-spacing="1">substitution and the count</text>
    <text x="0" y="22" font-size="11" fill="#444">Substitutions occur on the fly through a box at midfield. If a replacement enters before his</text>
    <text x="0" y="38" font-size="11" fill="#444">teammate exits, the team may be called for <tspan font-style="italic">too many men</tspan> &#8212; another form of offsides.</text>
    <text x="0" y="58" font-size="10" fill="#999" font-style="italic">This is why midfielders must communicate constantly during line changes.</text>
  </g>

  <line x1="52" y1="518" x2="848" y2="518" stroke="#ddd" stroke-width="0.5"/>
</svg>