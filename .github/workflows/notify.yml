name: Deployment Notifications

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages", "CI/CD Pipeline"]
    types:
      - completed

jobs:
  notify:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion != 'skipped' }}
    steps:
      - name: Create deployment comment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Deployment Status')
            );
            
            const status = '${{ github.event.workflow_run.conclusion }}';
            const workflowName = '${{ github.event.workflow_run.name }}';
            const runUrl = '${{ github.event.workflow_run.html_url }}';
            
            const commentBody = `## Deployment Status: ${status.toUpperCase()}
            
            **Workflow:** ${workflowName}
            **Run:** [View Details](${runUrl})
            **Time:** ${new Date().toISOString()}
            
            ${status === 'success' ? '✅ Deployment completed successfully!' : '❌ Deployment failed!'}`;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }
        if: github.event_name == 'pull_request'
