name: Optimized Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    
    concurrency:
      group: "pages"
      cancel-in-progress: true
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      
      - name: Build with optimizations
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NODE_ENV: "production"
      
      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed - no dist directory created"
            exit 1
          fi
          echo "Build successful - $(du -sh dist | cut -f1) generated"
      
      - name: Copy CNAME (if exists)
        run: |
          if [ -f CNAME ]; then
            cp CNAME dist/CNAME
            echo "CNAME file copied successfully"
          else
            echo "No CNAME file found, skipping"
          fi
      
      - name: Copy public assets
        run: |
          if [ -d public ]; then
            cp -r public/* dist/ 2>/dev/null || true
            echo "Public assets copied"
          fi
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
